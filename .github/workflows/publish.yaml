# Builds the gem and publishes it to RubyGems.org using trusted publishing (OIDC).
#
# Runs automatically when release-please publishes a GitHub release. It can also be
# triggered manually (e.g. to backfill a release) from either the release tag or from
# main, in which case the version in lib/flagsmith/version.rb must already be tagged.

name: Push Ruby Gem

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version

      - name: Check gem version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(ruby -r ./lib/flagsmith/version -e 'print Flagsmith::VERSION')
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ "$REF_NAME" = main ]; then
            tag="v$version"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Version $version from lib/flagsmith/version.rb has no $tag tag; refusing to publish an unreleased version."
              exit 1
            fi
          else
            echo "::error::Manual runs must start from main or a release tag, not $REF_NAME."
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match version $version in lib/flagsmith/version.rb."
            exit 1
          fi
          echo "Building flagsmith $version for tag $tag"

      - name: Build gem
        run: gem build flagsmith.gemspec

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: flagsmith-*.gem
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: rubygems

    permissions:
      id-token: write # to authenticate with RubyGems.org via trusted publishing

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ruby

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem to RubyGems.org
        run: gem push flagsmith-*.gem
